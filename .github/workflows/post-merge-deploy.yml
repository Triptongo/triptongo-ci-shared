name: Post-Merge Deploy (reusable)

# Reusable workflow — called by each Track App repo's own .github/workflows/deploy.yml
# via `uses: Triptongo/triptongo-ci-shared/.github/workflows/post-merge-deploy.yml@main`.
# Never copy this file into a Track App repo — reference it, so a fix here reaches every repo at once.
#
# Public repo on purpose: reusable workflows can't be shared across GitHub owners (org/user
# accounts) when private — only "same owner" or "public". This lets Track Apps outside the
# Triptongo org (personal projects, client repos under a different account) still call it.
# Nothing sensitive lives here — everything secret comes in via `secrets:`/`inputs:` from the
# caller. See triptongo-dev-playbook for the methodology docs (CLAUDE.md templates, ADRs,
# agent profiles), which stays private — this repo is only the generic deploy mechanics.
#
# Verifies migrations against the real schema (PRAGMA table_info), not against wrangler's own
# `d1_migrations` bookkeeping table — that table has been observed reporting a migration as applied
# when the DDL never ran. See "Post-Merge: Deploy y Migraciones" in each Track App's CLAUDE.md
# for the incident this workflow exists to prevent.
#
# Migrations are applied BEFORE the Worker deploys: deploying first would open a window where new
# code assumes a schema the database doesn't have yet.

on:
  workflow_call:
    inputs:
      environment:
        description: "Named Wrangler environment to deploy: staging or production"
        required: true
        type: string
      ref:
        description: "Commit SHA to check out and deploy (pass github.event.workflow_run.head_sha from the caller so this deploys exactly what CI validated, not whatever HEAD drifted to)"
        required: false
        type: string
        default: ""
      deploy_api:
        description: "Whether apps/api changed and should be deployed"
        required: true
        type: boolean
      deploy_dashboard:
        description: "Whether apps/dashboard changed and should be deployed"
        required: true
        type: boolean
      deploy_portal:
        description: "Whether apps/portal changed and should be deployed (optional — only Track Apps with a third frontend pass this)"
        required: false
        type: boolean
        default: false
      deploy_client_portal:
        description: "Whether apps/client-portal changed and should be deployed (optional — only Track Apps with a fourth frontend pass this)"
        required: false
        type: boolean
        default: false
      d1_database_name:
        description: "D1 database name for this environment (empty skips migrations)"
        required: false
        type: string
        default: ""
      migrations_dir:
        description: "Path to the migrations directory"
        required: false
        type: string
        default: "apps/api/migrations"
      wrangler_config:
        description: "Path to the API Worker's wrangler.toml — the D1 steps run from the repo root, so wrangler needs this to find the right config instead of relying on cwd discovery"
        required: false
        type: string
        default: "apps/api/wrangler.toml"
      api_health_url:
        description: "Health check URL for the API in this environment (empty skips the smoke check)"
        required: false
        type: string
        default: ""
      smoke_endpoints:
        description: >-
          JSON array of endpoints to hit after deploy and fail on 5xx, beyond the single
          api_health_url check above. Each entry: {"method": "GET", "url": "https://...",
          "description": "..."}. `method` defaults to GET. Unauthenticated requests only reach
          past auth middleware if the endpoint allows it — to smoke-check an endpoint gated by
          auth (e.g. an admin route with a JOIN, the exact class of bug this exists for), either
          pass the static SMOKE_TEST_TOKEN secret below, or (for a short-lived access token that
          a static secret can't cover) set login_url + SMOKE_TEST_EMAIL/SMOKE_TEST_PASSWORD to
          fetch a fresh one right before this step. A non-5xx response (401/403/404 included)
          counts as pass — this only catches the server crashing while handling the request, not
          authz/authn correctness. Empty array (default) skips this step entirely.
        required: false
        type: string
        default: "[]"
      login_url:
        description: >-
          Optional login endpoint to fetch a fresh bearer token right before the smoke_endpoints
          step, for a short-lived access token that a static SMOKE_TEST_TOKEN secret can't cover
          (a JWT that expires in minutes, say). POSTs {"email","password"} as JSON and expects
          the canonical Triptongo envelope back: {"success":true,"data":{"access_token":"..."}}.
          Requires SMOKE_TEST_EMAIL/SMOKE_TEST_PASSWORD secrets. When set, the token this
          produces is used instead of the static SMOKE_TEST_TOKEN secret for smoke_endpoints
          (not in addition to it) — set at most one of the two mechanisms. Empty (default) skips
          this step; smoke_endpoints then falls back to the static SMOKE_TEST_TOKEN secret, if any.
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SMOKE_TEST_TOKEN:
        description: "Optional static bearer token sent on every smoke_endpoints request, for endpoints behind auth with a non-expiring credential. Ignored if login_url is set."
        required: false
      SMOKE_TEST_EMAIL:
        description: "Email for the login_url flow above — required if login_url is set"
        required: false
      SMOKE_TEST_PASSWORD:
        description: "Password for the login_url flow above — required if login_url is set"
        required: false

# `npm ci` needs to read GitHub Packages for @triptongo/* scoped deps (see .npmrc in each Track
# App). `packages: read` here only sets the ceiling — the calling job's own `permissions:` block
# (in each repo's deploy.yml/deploy-production.yml) must also grant `packages: read`, or the
# effective token stays read-only on contents and npm ci 401s. contents:read is the default this
# workflow needs to check out the ref.
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment protection rules (required reviewers) live in each repo's own
    # Settings -> Environments -> production. This job pauses for approval there if configured —
    # nothing to set up in this workflow file itself.
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
      D1_DATABASE_NAME: ${{ inputs.d1_database_name }}
      MIGRATIONS_DIR: ${{ inputs.migrations_dir }}
      WRANGLER_CONFIG: ${{ inputs.wrangler_config }}
      API_HEALTH_URL: ${{ inputs.api_health_url }}
      SMOKE_ENDPOINTS: ${{ inputs.smoke_endpoints }}
      SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
      LOGIN_URL: ${{ inputs.login_url }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          # No `cache: npm` here on purpose: setup-node's npm cache restores a
          # prior ~/.npm content cache, and a stale/partial packument in it has
          # been observed making `npm ci` report an optional transitive dep
          # (e.g. @emnapi/runtime, pulled in by native-binding packages) as
          # missing from an otherwise-synced lockfile — reproduced on a Track
          # App 2026-07-19: CI failed with a restored cache, a clean clone of
          # the same commit installed fine. Deploy runs are infrequent, so a
          # cold `npm ci` here is worth the reliability.

      - run: npm ci
        env:
          # @triptongo/* scoped deps resolve from GitHub Packages per each Track App's .npmrc
          # (`@triptongo:registry=https://npm.pkg.github.com`) — without this, npm ci 401s.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply D1 migrations
        if: inputs.deploy_api && inputs.d1_database_name != ''
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --config "$WRANGLER_CONFIG" --env "$DEPLOY_ENV" --remote

      - name: Verify migrations against real schema (PRAGMA table_info)
        if: inputs.deploy_api && inputs.d1_database_name != ''
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          pairs_file=$(mktemp)

          for f in "$MIGRATIONS_DIR"/*.sql; do
            while IFS= read -r line; do
              table=$(echo "$line" | grep -oP '(?<=table=)[a-zA-Z0-9_]+' || true)
              column=$(echo "$line" | grep -oP '(?<=column=)[a-zA-Z0-9_]+' || true)
              if [ -z "$table" ] || [ -z "$column" ]; then
                echo "::error::$f has a malformed '-- verify:' line ('$line') — expected exactly 'table=<name> column=<name>'."
                exit 1
              fi
              echo "$table $column" >> "$pairs_file"
            done < <(grep -oP -- '^-- verify:.*' "$f" || true)
          done

          if [ ! -s "$pairs_file" ]; then
            echo "::warning::No migration in $MIGRATIONS_DIR declares a '-- verify: table=X column=Y' header — nothing was checked against the real schema. See docs/00-playbook.md for the annotation convention."
            rm -f "$pairs_file"
            exit 0
          fi

          checked=0
          for table in $(cut -d' ' -f1 "$pairs_file" | sort -u); do
            echo "Fetching schema for $table"
            result=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --config "$WRANGLER_CONFIG" --env "$DEPLOY_ENV" --remote --json --command "PRAGMA table_info($table);")
            actual_columns=$(echo "$result" | jq -r '.[0].results[].name')
            while IFS= read -r column; do
              checked=$((checked + 1))
              echo "Verifying $table.$column"
              if ! echo "$actual_columns" | grep -qx "$column"; then
                echo "::error::A migration declares $table.$column but PRAGMA table_info($table) does not show that column in $DEPLOY_ENV. wrangler d1 migrations list may say this migration is applied even though the DDL never ran — that mismatch is the known failure mode, not a fluke. Investigate before assuming the migration succeeded."
                rm -f "$pairs_file"
                exit 1
              fi
            done < <(awk -v t="$table" '$1==t {print $2}' "$pairs_file")
          done
          rm -f "$pairs_file"
          echo "Verified $checked column(s) against the real schema."

      - name: Deploy API Worker
        if: inputs.deploy_api
        run: npm -w apps/api run "deploy:$DEPLOY_ENV"

      - name: Smoke check API
        if: inputs.deploy_api && inputs.api_health_url != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$API_HEALTH_URL")
          if [ "$status" != "200" ]; then
            echo "::error::Health check failed for $API_HEALTH_URL (HTTP $status)"
            exit 1
          fi

      - name: Log in for authenticated smoke checks
        if: inputs.deploy_api && inputs.smoke_endpoints != '[]' && inputs.login_url != ''
        shell: bash
        run: |
          set -e
          if [ -z "$SMOKE_TEST_EMAIL" ] || [ -z "$SMOKE_TEST_PASSWORD" ]; then
            echo "::error::login_url is set but SMOKE_TEST_EMAIL/SMOKE_TEST_PASSWORD secrets are missing"
            exit 1
          fi

          response=$(curl -s --max-time 10 --connect-timeout 5 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$SMOKE_TEST_EMAIL\",\"password\":\"$SMOKE_TEST_PASSWORD\"}" \
            "$LOGIN_URL")
          token=$(echo "$response" | jq -r '.data.access_token // empty')

          if [ -z "$token" ]; then
            # No se loguea $response completo: si el login falla por credenciales, el
            # error de la API puede repetir el email en texto plano — no hace falta
            # para diagnosticar, y menos superficie es mejor acá.
            echo "::error::Login contra $LOGIN_URL no devolvió .data.access_token — ¿credenciales vencidas, cuenta inactiva, o la API no respeta el envelope {success,data} esperado?"
            exit 1
          fi

          # Pisa el SMOKE_TEST_TOKEN del entorno del job (viene de un secret estático,
          # si se pasó) para los steps siguientes — con login_url seteado, el token
          # fresco de acá es el que se usa, nunca ambos a la vez.
          echo "::add-mask::$token"
          echo "SMOKE_TEST_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Smoke check endpoints touched by this deploy
        if: inputs.deploy_api && inputs.smoke_endpoints != '[]'
        shell: bash
        run: |
          set -e
          count=$(echo "$SMOKE_ENDPOINTS" | jq 'length')
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          auth_header=()
          if [ -n "$SMOKE_TEST_TOKEN" ]; then
            auth_header=(-H "Authorization: Bearer $SMOKE_TEST_TOKEN")
          fi

          failed=0
          for i in $(seq 0 $((count - 1))); do
            entry=$(echo "$SMOKE_ENDPOINTS" | jq ".[$i]")
            url=$(echo "$entry" | jq -r '.url')
            method=$(echo "$entry" | jq -r '.method // "GET"')
            desc=$(echo "$entry" | jq -r '.description // .url')

            # No encadenar directo con `set -e`: si curl no puede conectar (timeout,
            # DNS, connection refused) sale con exit code no-cero aunque escriba
            # "000" vía -w, y eso abortaría el script acá mismo, saltando en
            # silencio el resto de los endpoints todavía sin chequear.
            if ! status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 -X "$method" "${auth_header[@]}" "$url"); then
              echo "::error::Smoke check failed for '$desc' ($url): curl no pudo completar el request (timeout/conexión)"
              failed=1
              continue
            fi
            echo "[$method] $desc -> HTTP $status"
            if [ "$status" -ge 500 ]; then
              echo "::error::Smoke check failed for '$desc' ($url): HTTP $status"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      - name: Deploy Dashboard
        if: inputs.deploy_dashboard
        run: npm -w apps/dashboard run "deploy:$DEPLOY_ENV"

      - name: Deploy Portal
        if: inputs.deploy_portal
        run: npm -w apps/portal run "deploy:$DEPLOY_ENV"

      - name: Deploy Client Portal
        if: inputs.deploy_client_portal
        run: npm -w apps/client-portal run "deploy:$DEPLOY_ENV"
